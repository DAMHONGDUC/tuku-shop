name: tuku_shop
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dartz: ^0.10.1
  system_design:
    path: packages/flutter-system-design-kit
  cupertino_icons: ^1.0.8
  go_router: ^15.1.2
  flutter_bloc: ^9.1.1
  injectable: ^2.5.0
  get_it: ^8.0.3
  equatable: ^2.0.7
  adaptive_theme: ^3.7.0
  carousel_slider: ^5.1.1
  collection: ^1.19.1
  sliver_tools: ^0.2.12
  uuid: ^4.5.2
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0
  melos: ^6.3.2
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  shared_preferences_platform_interface: ^2.4.2
  fake_async: ^1.3.3
  # Config is the `flutter_launcher_icons:` block below; run with `make app-icon`.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/banner/
    - assets/images/catalog/accessories/
    - assets/images/catalog/activewear/
    - assets/images/catalog/bags/
    - assets/images/catalog/hoodies/
    - assets/images/catalog/jackets/
    - assets/images/catalog/jeans/
    - assets/images/catalog/kids/
    - assets/images/catalog/men-shirts/
    - assets/images/catalog/men-tshirts/
    - assets/images/catalog/shoes/
    - assets/images/catalog/trousers/
    - assets/images/catalog/women-dresses/
    - assets/images/catalog/women-skirts/
    - assets/images/catalog/women-tops/
    - assets/images/common/
    - assets/images/app_icon.png

# Source of every launcher icon and launch screen image; regenerate with `make app-icon`.
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  ios: true
  # App Store Connect rejects a 1024 icon with an alpha channel (ITMS-90717).
  remove_alpha_ios: true
  # AppColors.primary, the same colour as the launch screen.
  background_color_ios: "#504EB7"
  android: "ic_launcher"
