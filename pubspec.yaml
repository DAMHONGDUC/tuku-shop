name: tuku_shop
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dartz: ^0.10.1
  system_design:
    path: packages/flutter-system-design-kit
  cupertino_icons: ^1.0.8
  go_router: ^15.1.2
  flutter_bloc: ^9.1.1
  injectable: ^2.5.0
  get_it: ^8.0.3
  equatable: ^2.0.7
  google_fonts: ^6.2.1
  adaptive_theme: ^3.7.0
  carousel_slider: ^5.1.1
  collection: ^1.19.1
  sliver_tools: ^0.2.12
  uuid: ^4.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0
  melos: ^6.3.2
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/google_fonts/
    - assets/icons/
    - assets/images/banner/
    - assets/images/product/
    - assets/images/category/
    - assets/images/review_comment/
    - assets/images/common/
    - assets/videos/review_comment/
